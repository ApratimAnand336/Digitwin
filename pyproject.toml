[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digitwin"
version = "0.1.0"
description = "Predictive-prescriptive digital twin for a vehicle assembly line (Accenture Hackathon prototype)"
requires-python = ">=3.10"
dependencies = [
    # Data
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    # Deep learning
    "torch>=2.0",
    # Visualisation
    "matplotlib>=3.7",
    "plotly>=5.15",
    "networkx>=3.1",
    # Dashboard
    "streamlit>=1.28",
    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulator*", "soft_sensor*", "model*", "anomaly*", "action*", "dashboard*", "eval*"]

[tool.setuptools.package-dir]
"" = "."
